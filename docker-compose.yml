version: '3.8'

services:
  backend:
    # Use ECR image when deployed, or build locally for testing
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG:-latest}
    build: .
    container_name: plant_notebook_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./config/serviceAccountKey.json:/app/config/serviceAccountKey.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres

  postgres:
    image: postgres:15-alpine
    container_name: plant_notebook_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
      POSTGRES_DB: ${DB_NAME:-plant_notebook}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-plant_notebook}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
