version: '3.8'

services:
  backend:
    # Use ECR image when deployed, or build locally for testing
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG:-latest}
    build: .
    container_name: plant_notebook_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./config/serviceAccountKey.json:/app/config/serviceAccountKey.json:ro
    environment:
      - NODE_ENV=development
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - GEMINI_API_KEY=${GEMINI_API_KEY}

  ai_worker:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG:-latest}
    build: .
    container_name: plant_notebook_ai_worker
    restart: unless-stopped
    command: node workers/aiWorker.js
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./config/serviceAccountKey.json:/app/config/serviceAccountKey.json:ro
    environment:
      - NODE_ENV=development
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
