name: Deploy Backend to AWS EC2 via ECR

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-push:
    name: Build and Push Docker Image to ECR
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          # Also tag as latest
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup SSH and Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Prepare directory
            mkdir -p ~/plant-notebook-backend
            cd ~/plant-notebook-backend

            # 2. Inject Secrets directly on EC2 from GitHub Secrets
            echo "${{ secrets.ENV_FILE }}" > .env
            mkdir -p config
            echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > config/serviceAccountKey.json

            # 3. Create docker-compose.yml file on server
            cat << 'EOF' > docker-compose.yml
            version: '3.8'

            services:
              backend:
                image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest
                container_name: plant_notebook_backend
                restart: unless-stopped
                ports:
                  - "5000:5000"
                env_file:
                  - .env
                volumes:
                  - ./logs:/app/logs
                  - ./config/serviceAccountKey.json:/app/config/serviceAccountKey.json:ro
                depends_on:
                  postgres:
                    condition: service_healthy
                environment:
                  - NODE_ENV=production
                  - DB_HOST=postgres

              postgres:
                image: postgres:15-alpine
                container_name: plant_notebook_db
                restart: unless-stopped
                env_file:
                  - .env
                environment:
                  POSTGRES_USER: ${DB_USER:-postgres}
                  POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
                  POSTGRES_DB: ${DB_NAME:-plant_notebook}
                ports:
                  - "5432:5432"
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-plant_notebook}"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

            volumes:
              postgres_data:
            EOF

            # 4. Login to ECR on EC2
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            # 5. Pull latest image and restart
            docker-compose pull backend
            docker-compose down
            docker-compose up -d
